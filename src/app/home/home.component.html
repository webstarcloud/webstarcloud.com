<div class="container min-vh-100">
    <div class="home-utility">
        <button class="access-trigger" type="button" (click)="toggleAuthPanel()">
            <ng-container *ngIf="authState$ | async as state">
                {{ state.isAuthenticated ? 'Private Access' : 'Lab Access' }}
            </ng-container>
        </button>
    </div>

    <section class="home-caption">
        <p class="home-kicker">R&amp;D Principle Architect | Lead Engineer</p>
        <!-- <p class="home-summary">
            Notes on agentic systems, architecture, tooling, and what actually survives contact with production.
        </p> -->
    </section>

    <section class="home-animation" aria-label="Interactive avatar">
        <app-particles></app-particles>
    </section>

    <section class="private-space" *ngIf="(authState$ | async)?.isAuthenticated">
        <p class="private-space__kicker">Private Surfaces Unlocked</p>
        <p class="private-space__copy">Reserved for second-brain views, drafts, and gated internal experiments.</p>
    </section>

    <div class="row justify-content-md-center">
        <div class="footer-links text-center">
            <a class="nav-link d-inline" href="https://github.com/davidwebstar34" target="_blank" rel="noreferrer">GitHub</a>
            <a class="nav-link d-inline" href="https://www.linkedin.com/in/webstar/" target="_blank" rel="noreferrer">LinkedIn</a>
            <a class="nav-link d-inline" href="https://x.com/WebstarDavid" target="_blank" rel="noreferrer">X</a>
        </div>
    </div>

    <app-auth-panel [open]="authPanelOpen" (closed)="closeAuthPanel()"></app-auth-panel>
</div>
