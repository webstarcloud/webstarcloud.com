<div class="particles-panel">
    <div class="canvas-wrapper">
        <div #rendererContainer class="renderer-container">
            <!-- Three.js canvas will be injected here -->
        </div>

        <div *ngIf="loading" class="loading-overlay">
            <p>Loading Dave 2.0{{ loadingDots }}</p>
        </div>
    </div>

    <div class="question-panel text-center">
        <div class="input-row">
            <input class="form-control" type="text" placeholder="Ask a question"
                [(ngModel)]="question"
                [disabled]="isDisabled || gateLocked" (keyup.enter)="askQuestion()">
            <button type="button" class="btn btn-success" (click)="askQuestion()" [disabled]="isDisabled || gateLocked">
                Ask
            </button>
        </div>
        <div class="gate-panel" *ngIf="gateLocked">
            <p class="gate-copy">That was the one free answer. The deeper layer is invite-only &mdash; request access and I&apos;ll let people in a few at a time.</p>
            <button type="button" class="gate-button" (click)="requestAccess.emit()">
                Request access
            </button>
        </div>
        <p class="response-copy">
            {{ displayedMessage }}{{ displayedDots }}
        </p>
        <app-artifact-viewer [responseMarkdown]="activeResponseMarkdown"></app-artifact-viewer>
    </div>
</div>
